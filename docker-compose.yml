# Local MySQL 8 for trying the database without installing anything else.
#   docker compose up -d
#   MYSQL="mysql -h 127.0.0.1 -P 3307 -u root -ppm" scripts/load.sh
#   MYSQL="mysql -h 127.0.0.1 -P 3307 -u root -ppm" scripts/test.sh
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: pm
    ports:
      - "3307:3306"
    command: --log-bin-trust-function-creators=1
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ppm"]
      interval: 5s
      retries: 20
